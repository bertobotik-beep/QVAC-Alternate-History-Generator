<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Alternate History Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #2b1b12 0%, #4a2e1a 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #f3e3d3;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 520px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #e3a15a; font-weight: 800; }
  .subtitle { color: #cbab8c; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #3a2416;
    border: 2px solid #6b4527;
    border-radius: 20px;
    padding: 30px 26px;
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #6b4527;
    background: #2b1b12;
    color: #f3e3d3;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  input[type=text]::placeholder { color: #a37e5c; }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #e3a15a;
    color: #2b1b12;
    box-shadow: 0 5px 0 #a86e30;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #a86e30; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #cbab8c; min-height: 1.2em; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #2b1b12;
    background: #e3a15a;
    border-radius: 999px;
    padding: 3px 10px;
    margin-bottom: 10px;
  }
  .result-body { font-size: 1.05rem; line-height: 1.7; margin: 4px 0 4px; color: #f3e3d3; text-align: left; }
  .footer-note { color: #cbab8c; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #6b4527;
    border-top-color: #e3a15a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🕰️</div>
    <h1>Alternate History Generator</h1>
    <p class="subtitle">Enter a real historical event, get a speculative "what if" paragraph. 100% on-device.</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="e.g. the moon landing, the fall of Rome" />
      <button class="action" id="generateBtn">Speculate</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Rewriting the timeline...';

      try {
        const res = await fetch('/api/altHistory', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="badge">Speculative Fiction</div><div class="result-body">${escapeHtml(data.speculation)}</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
